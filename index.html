<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Midterm Projects User Profiles</title>
	<!--Bootstrap links-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>	
	<script defer src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
	<!-- My Style & Scripts -->
	<link rel="stylesheet" href="style.css">
	<script defer src="script.js"></script>
</head>
<body>

<!-- Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="LoginTitle" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
		<!-- Modal Header (close and title) -->
		<div class="modal-header">
        	<h1 class="modal-title fs-5" id="LoginTitle">Login</h1>
        	<button type="button" class="btn-close" id="modalX" aria-label="Close"></button>
      	</div>
	  	<!-- Modal Body - Login Form -->
      	<div class="modal-body">
			<form>
			<div class="mb-3">
				<div id="incorrect" class="form-text text-danger h5 hidden" aria-hidden="true">Username or password is incorrect.</div>
				<label for="userNameIn" class="form-label">Username</label>
				<input type="text" class="form-control" id="userNameIn" aria-describedby="username">
			</div>
			<div class="mb-3">
				<label for="userPasswordIn" class="form-label">Password</label>
				<input type="password" class="form-control" id="userPasswordIn">
			</div>
      	</div>
	  	<!-- Modal Footer (Buttons) -->
      	<div class="modal-footer">
        	<button type="button" class="btn btn-outline-secondary " id="loginCancelButton">Cancel</button>
        	<button type="button" class="btn btn-primary" id="loginModalButton">Login</button>
      	</div>
    </div>
  </div>
</div>

<!--NAVBAR-->
	<nav class="navbar navbar-expand-lg mb-3">
	  <div class="container-fluid">
		<a class="navbar-brand" href="#">Members</a>
		<button type="button nav-link" class="btn btn-primary hidden" id="navChangeUserButton">
				Change User
		</button>
		<button type="button nav-link" class="btn btn-primary" id="navLoginButton">
				Login
		</button>
	  </div>
	</nav>
<!--MAIN-->
	<main class="container-fluid">
		<div class="row" id="userDiv">
				<!-- cards of user information will go here -->
		</div>
	</main>
<!--FOOTER-->
	<div class="container-fluid foot">
		<footer class="row d-flex flex-wrap justify-content-between align-items-center py-3">
			<div class="col-md-4 d-flex align-items-center">
				<span class="mb-3 mb-md-0 text-body-secondary">© 2026</span>
			</div>
		</footer>
	</div>
</body>
</html>
